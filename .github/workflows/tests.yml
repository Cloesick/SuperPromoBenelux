name: Tests

on:
  push:
    branches: [main]
    # The scrape and harvest commit folder data and nothing else. Running
    # the full suite — build plus 1000+ Cypress tests — on data that no test
    # asserts against was the single largest avoidable cost in CI.
    paths-ignore:
      - "data/folders/**"
      - "data/health.json"
      - "public/screenshots/**"
  pull_request: {}

# Each push to a pull request starts a fresh run and the previous one keeps
# going to completion. Ten pushes in an evening meant ten full suites, most
# of them already superseded. Cancel the stale ones.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci --legacy-peer-deps

      # Catches the class of failure that took every retailer logo offline for
      # months: assets referenced by data but absent from the repository. The
      # unit suite mocks next/image, so broken image URLs are invisible to it.
      #
      # Page images are committed again: duplicate collapsing and orphan pruning
      # cut public/screenshots from 298 MB to single-digit MB, which is small
      # enough to track. The advisory flag is therefore gone — a referenced page
      # image that is missing or empty now fails the build, same as a logo.
      - name: Referenced assets exist
        run: node scripts/check-assets.mjs

      - name: Unit + component tests
        run: npm test

      - name: E2E tests (Cypress)
        run: npm run test:e2e
