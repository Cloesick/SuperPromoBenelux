name: Harvest Publitas folders

# Apify-free folder refresh. Pulls the current weekly folder (public PDF +
# manifest) for every Publitas-hosted retailer via plain HTTP and commits the
# updated data/folders/*.json. Runs daily because retailers publish on different
# days (mon/wed/thu/sun); the harvester only overwrites a file on success, so a
# missing folder for one retailer never wipes its last-good data.

on:
  schedule:
    # The harvested retailers publish weekly too, so this follows the same
    # days as the scrape (an hour later, so the two never contend for the
    # same folder files). Daily meant six wasted runs in seven.
    - cron: "20 5 * * 1" # Monday
    - cron: "20 5 * * 3" # Wednesday
    - cron: "20 5 * * 4" # Thursday
  push:
    branches: [main]
    paths:
      - "apify/harvest-all.mjs"
      - "apify/harvest-publitas.mjs"
      - ".github/workflows/harvest-publitas.yml"
  workflow_dispatch:
    inputs:
      retailers:
        description: "Comma-separated slugs (optional, default all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: harvest-publitas
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Harvest folders
        shell: bash
        env:
          RETAILERS: ${{ github.event.inputs.retailers }}
        run: |
          echo "Harvesting Publitas folders: ${RETAILERS:-<all>}"
          node apify/harvest-all.mjs ${RETAILERS}

      # The harvest can read Publitas' manifest but not its page images —
      # those are signed and lazy-loaded — so it writes pages: []. Rendering
      # the PDF here is what actually gives these 14 retailers page images;
      # without it they only ever frame a PDF.
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci --legacy-peer-deps

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Render harvested PDFs to page images
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: npx tsx scripts/backfill-pdf-pages.mts

      - name: Prune unreferenced screenshots
        run: node scripts/prune-screenshots.mjs

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- data/folders; then
            echo "No folder changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f data/folders
          git commit -m "chore(harvest): refresh Publitas folders [skip ci]"
          git push
