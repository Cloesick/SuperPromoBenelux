name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Patch next.config for static export
        run: |
          cat > next.config.ts << 'EOF'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            images: { unoptimized: true },
          };
          export default nextConfig;
          EOF
      - name: Remove server-only routes for static build
        run: |
          rm -rf src/app/api src/app/**/admin || true
          rm -f src/app/sitemap.ts src/app/sitemap.xml src/app/robots.ts || true
          find src/app -name "route.ts" | xargs grep -l "force-dynamic\\|neon\\|supabase\\|getEvents" 2>/dev/null | xargs rm -f || true
      - name: Build static export
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
