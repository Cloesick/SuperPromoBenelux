name: Scrape folders

on:
  schedule:
    # Daily (UTC). Adjust if you want retailer-day-specific runs.
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-folders
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci --legacy-peer-deps

      - name: Scrape
        env:
          # GitHub-hosted runners have Chrome installed.
          # We use it because puppeteer_skip_download=true disables bundled Chromium.
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          # Optional. When this secret exists, src/scrapers/pageStorage.ts
          # uploads each page image and records the absolute URL, so captures
          # stop being committed to git. When it is absent the scraper falls
          # back to /screenshots paths and the commit step below still works —
          # so setting the secret is the only action needed to switch over.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: npm run scrape

      - name: Health check
        run: |
          if [ ! -f data/health.json ]; then
            echo "⚠ No health manifest found"
            exit 0
          fi

          echo "=== Data Health Report ==="
          node -e "
            const h = require('./data/health.json');
            const s = h.summary;
            console.log('Fresh: ' + s.fresh + ' | Fallback: ' + s.fallback + ' | Stale: ' + s.stale + ' | Missing: ' + s.missing);
            if (s.withDeadUrls > 0) console.log('⚠ Dead URLs stripped: ' + s.withDeadUrls + ' retailer(s)');
            if (s.withErrors > 0) console.log('⚠ Validation errors: ' + s.withErrors + ' retailer(s)');
            for (const r of h.retailers) {
              const issues = r.validationIssues.filter(i => i.severity === 'error');
              if (issues.length > 0) console.log('  ✗ ' + r.slug + ': ' + issues.map(i => i.message).join('; '));
              const dead = r.probeResults.filter(p => !p.live);
              if (dead.length > 0) console.log('  ⚠ ' + r.slug + ': dead URLs — ' + dead.map(d => d.url + ' (' + d.status + ')').join('; '));
            }
            if (s.missing > 0) { console.error(s.missing + ' retailer(s) have NO data!'); process.exit(1); }
          "

      # Screenshots are committed, so unreferenced ones would accumulate in git
      # history forever. The scraper writes every capture it takes, but duplicate
      # collapsing and blank detection mean most are never referenced: before
      # this step existed, public/screenshots held 1233 files of which 122 were
      # in use. Pruning first keeps the committed set at single-digit MB.
      - name: Prune unreferenced screenshots
        run: node scripts/prune-screenshots.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -A so the prune's deletions are staged too, not just new captures;
          # -f because public/ was historically gitignored and some clones still
          # carry that rule. Paths are listed explicitly (never a bare `git add
          # -A`) so the scrape's other byproducts stay out of history — notably
          # data/products.db, the SQLite archive that is rewritten wholesale on
          # every run and is gitignored for exactly that reason. Do not add it
          # here: nothing at runtime reads it, and it recreates its own schema.
          git add -A -f data/folders data/health.json public/screenshots || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update scraped folders and screenshots"
          git push
